[platformio]
src_dir = src
include_dir = include
default_envs = compile_check

[env:native]
platform = platformio/native@1.2.1
test_framework = unity
test_build_src = no
build_src_filter = -<*>
build_flags = -std=c++11

[env:device]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_src_filter = +<main.cpp>
lib_deps =
  mobizt/Firebase Arduino Client Library for ESP8266 and ESP32@4.4.17
  adafruit/Adafruit INA219@1.2.3
  claws/BH1750@1.3.0
  adafruit/DHT sensor library@1.4.7

[env:compile_check]
extends = env:device
build_flags = -DVOLTARAX_COMPILE_CHECK
