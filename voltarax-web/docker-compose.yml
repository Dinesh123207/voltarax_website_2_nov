services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: voltarax
      POSTGRES_DB: voltarax
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private local database password}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltarax -d voltarax"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  redis:
    image: redis:7.2.17-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set a private local Redis password}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set a private local Redis password}
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
